[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen"
version = "0.1.0"
description = "Local observatory for GPU, system, and model-run metrics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mohammed Saqlain" }]
keywords = ["gpu", "llm", "training", "observability", "ollama", "nvidia"]
classifiers = [
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "psutil>=5.9",
  "nvidia-ml-py>=12.535",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/saqlain2204/lumen"
Repository = "https://github.com/saqlain2204/lumen"

[project.scripts]
lumen = "lumen.cli:main"

[tool.setuptools.packages.find]
include = ["lumen*"]

[tool.setuptools.package-data]
lumen = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
